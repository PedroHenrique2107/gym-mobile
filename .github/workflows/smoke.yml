name: Smoke do preview

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL do deployment Vercel que sera validado
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Paginas, PWA e headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke
